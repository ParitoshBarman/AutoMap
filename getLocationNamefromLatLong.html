<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Geocoding with OpenStreetMap</title>
</head>
<body>
    <h2>Find Location Name from Latitude & Longitude</h2>
    <label for="latitude">Latitude:</label>
    <input type="text" id="latitude" placeholder="Enter latitude">
    <br><br>
    <label for="longitude">Longitude:</label>
    <input type="text" id="longitude" placeholder="Enter longitude">
    <br><br>
    <button onclick="getLocationName()">Get Location</button>
    <h3>Location Name: <span id="location-name"></span></h3>

    <script>
        function getLocationName() {
            let lat = document.getElementById("latitude").value;
            let lon = document.getElementById("longitude").value;

            if (!lat || !lon) {
                alert("Please enter both latitude and longitude.");
                return;
            }

            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

            fetch(url, {
                headers: {
                    'User-Agent': 'Mozilla/5.0 (YourAppName)' // Required for Nominatim API
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.display_name) {
                    document.getElementById("location-name").innerText = data.display_name;
                } else {
                    document.getElementById("location-name").innerText = "No location found";
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
